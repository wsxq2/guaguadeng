<style>
:root{font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif;color:#f4edda;background:#102b29;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 30%,#246b5a 0,#144a40 48%,#0d302d 100%)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #f6c467;outline-offset:3px}.app{max-width:1100px;margin:auto;min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brandmark{width:38px;height:38px;border:1px solid #d7bb7c;border-radius:50%;display:grid;place-items:center;color:#efd396;font-size:22px}.brand h1{font-family:Georgia,serif;font-size:23px;letter-spacing:.1em;margin:0}.eyebrow{color:#c7d2bd;font-size:10px;letter-spacing:.2em}.top-actions{display:flex;gap:8px}.ghost{background:#ffffff0c;color:#f3ecd9;border:1px solid #ffffff35;border-radius:8px;padding:9px 12px}.table{position:relative;flex:1;min-height:390px;margin:14px 0 8px;border:1px solid #c5ae7760;border-radius:24px;background:radial-gradient(ellipse at center,#245e50a6,#113e37b8);box-shadow:inset 0 0 55px #071d1b80,0 15px 35px #051b1a45;display:grid;grid-template-columns:1fr 1.3fr 1fr;grid-template-rows:auto 1fr auto;gap:8px;padding:18px}.seat{min-width:0}.north{grid-column:2;justify-self:center;text-align:center}.west{grid-row:2;grid-column:1;align-self:center}.east{grid-row:2;grid-column:3;align-self:center;text-align:right}.self{grid-column:1;grid-row:3;align-self:end}.seat-head{display:inline-flex;align-items:center;gap:8px}.avatar{width:37px;height:37px;border-radius:50%;border:1px solid #dfc48988;display:grid;place-items:center;background:#c5a86e20;color:#f2d69d;font-family:serif;font-size:17px}.seat.active .avatar{background:#e3bf75;color:#173c34;box-shadow:0 0 0 4px #e3bf7530}.seat-name{font-size:14px;font-weight:700}.seat-stats{font-size:11px;color:#c5d5c4;margin-top:5px;line-height:1.6}.badge{font-size:10px;color:#e9c982}.played{display:flex;gap:4px;margin-top:8px;justify-content:inherit;min-height:50px}.east .played{justify-content:flex-end}.north .played{justify-content:center}.mini{width:34px;height:48px;border-radius:5px;background:#faf4e4;color:#263432;box-shadow:0 2px 4px #0004;padding:4px;font-family:Georgia,serif;font-weight:700;font-size:14px}.red{color:#bc4e45}.center{grid-column:2;grid-row:2;align-self:center;justify-self:center;text-align:center;max-width:220px}.ornament{font-size:26px;color:#d8bb7b;letter-spacing:.25em}.round-label{font-size:10px;letter-spacing:.2em;color:#bfd3bd;margin:12px 0 5px}.message{font-size:15px;line-height:1.5;color:#f7ecd2}.start{background:#e6c383;color:#173b32;border:0;border-radius:9px;font-weight:700;padding:12px 24px;margin-top:16px}.start:hover,.primary:hover{background:#f3d597}.self-play{grid-row:3;grid-column:2;align-self:end;justify-self:center;text-align:center}.hand-panel{padding:7px 0 0}.hand-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.hand-title{font-size:12px;letter-spacing:.12em;color:#d9e1d3}.controls{display:flex;gap:7px}.control{border:1px solid #b9d0be55;border-radius:8px;background:#ffffff0d;color:#f4edda;padding:8px 14px}.primary{background:#e6c383;border-color:#e6c383;color:#143d34;font-weight:700}.control:disabled{opacity:.35;cursor:default}.hand{display:flex;overflow-x:auto;gap:7px;padding:14px 3px 7px;min-height:122px;scrollbar-color:#b99c67 transparent}.card{flex:0 0 64px;height:91px;background:#fbf6e9;border:1px solid #fff9;border-radius:7px;color:#25332f;box-shadow:0 4px 8px #071c1a80;position:relative;text-align:left;padding:5px 7px;transition:transform .15s}.card .v{font-family:Georgia,serif;font-weight:bold;font-size:20px;line-height:1}.card .s{font-size:27px;position:absolute;left:50%;top:47%;transform:translate(-50%,-50%)}.card.red{color:#b94842}.card.selected{transform:translateY(-11px);box-shadow:0 0 0 3px #eccb83,0 7px 10px #0005}.empty{font-size:13px;color:#c2d2c2;margin:auto}.foot{font-size:11px;color:#b3c7b6;text-align:center;margin-top:4px}.dialog{border:1px solid #d6c08c;border-radius:16px;padding:22px;max-width:min(90vw,460px);background:#f8f3e8;color:#254139;box-shadow:0 18px 70px #0008}.dialog::backdrop{background:#071d1ac9}.dialog h2{margin:0 0 10px;font-family:serif}.dialog p{line-height:1.7;font-size:14px}.dialog .close{background:#194d40;color:white;border:0;border-radius:8px;padding:10px 18px}.scoreline{color:#e9d29c;font-size:12px;margin-top:6px}@media(max-width:600px){.app{padding:10px 10px max(10px,env(safe-area-inset-bottom))}.top{gap:5px}.brand h1{font-size:20px}.brandmark{width:32px;height:32px}.eyebrow{font-size:9px}.ghost{padding:7px 9px;font-size:12px}.table{padding:10px;margin:10px 0 4px;min-height:350px;grid-template-columns:1fr 1.2fr 1fr}.avatar{width:30px;height:30px;font-size:14px}.seat-stats{font-size:10px}.played{min-height:40px}.mini{width:28px;height:40px;font-size:12px;padding:3px}.center{width:100%}.message{font-size:13px}.ornament{font-size:21px}.control{padding:8px 10px;font-size:13px}.card{flex-basis:52px;height:76px}.card .v{font-size:17px}.card .s{font-size:23px}.hand{min-height:104px}.hand-title{font-size:11px}}@media(max-height:500px) and (orientation:landscape){.app{padding:6px 12px}.top{min-height:30px}.brandmark{width:27px;height:27px}.brand h1{font-size:17px}.eyebrow,.foot{display:none}.table{min-height:170px;margin:5px 0;padding:6px;grid-template-rows:auto 1fr auto}.avatar{width:24px;height:24px;font-size:12px}.seat-stats{margin:0;font-size:10px}.played{min-height:30px;margin-top:2px}.mini{width:23px;height:30px;font-size:10px;padding:2px}.ornament,.round-label{display:none}.message{font-size:12px}.start{padding:6px 16px;margin-top:4px}.hand{min-height:72px;padding:10px 3px 3px}.card{height:58px;flex-basis:42px}.card .v{font-size:14px}.card .s{font-size:17px}.hand-top{margin:0}.control{padding:5px 12px}.seat-head{gap:4px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><div class="brandmark">♠</div><div><div class="eyebrow">A GAME OF FOUR</div><h1>刮刮登</h1></div></div><div class="top-actions"><button class="ghost" id="rulesBtn">游戏规则</button><button class="ghost" id="endBtn">结束本场</button></div></header><section class="table" aria-label="游戏牌桌"><div id="north" class="seat north"></div><div id="west" class="seat west"></div><div class="center"><div class="ornament">♠ ♥ ♣ ♦</div><div class="round-label" id="roundLabel">GUAGUADENG</div><div class="message" id="message" aria-live="polite"></div><button class="start" id="startBtn">开始游戏</button></div><div id="east" class="seat east"></div><div id="self" class="seat self"></div><div id="selfPlay" class="self-play"></div></section><section class="hand-panel"><div class="hand-top"><div class="hand-title">你的手牌 <span id="handCount"></span></div><div class="controls"><button class="control" id="clearBtn">清空</button><button class="control" id="hintBtn">提示</button><button class="control primary" id="playBtn">出牌</button></div></div><div class="hand" id="hand" aria-label="你的手牌"></div></section><div class="foot">离线牌桌 · 一位玩家与三位电脑对手</div></main><dialog id="rulesDialog" class="dialog"><h2>刮刮登怎么玩</h2><p>每人 10 张牌。庄家先领出 1～4 张相同点数的牌；其他人按顺序跟相同数量，优先出同点数的牌。能压过当前领先牌时必须压牌。</p><p>第三个出牌者如果能出 8 点或以上且能压牌，必须这样出；否则如果能压牌，须出能压过的最大牌。同点数时先出者胜，混合牌不能获胜。</p><p>每轮胜者只获得自己出的牌，并领出下一轮。每局积分变化 = 获牌张数 × 4 − 10。点击“提示”可选择一组合法牌。</p><button class="close" id="closeRules">知道了</button></dialog>
<script id="engine">
'use strict';
const SUITS=['♠','♥','♦','♣'];
function combinations(a,n){const out=[];function go(s,c){if(c.length===n){out.push(c.slice());return}for(let i=s;i<=a.length-(n-c.length);i++){c.push(a[i]);go(i+1,c);c.pop()}}go(0,[]);return out}
function pattern(cards){const m={};for(const c of cards)m[c.v]=(m[c.v]||0)+1;return Object.values(m).sort((a,b)=>b-a)}
function cmp(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0}
function winner(round){let best=null;for(const p of round.plays){if(pattern(p.cards).length===1&&(!best||p.cards[0].v>best.cards[0].v))best=p}return best?.id??null}
function validate(hand,cards,round){if(round.plays.length===4)return '本轮已经结束';if(!round.plays.length){if(cards.length<1||cards.length>4)return '领牌必须出 1～4 张牌';if(cards.some(c=>c.v!==cards[0].v))return '领牌必须全部为相同点数';return ''}const n=round.plays[0].cards.length;if(cards.length!==n)return '跟牌数量必须与领牌一致';const shapes=combinations(hand,n).map(pattern);const best=shapes.reduce((a,b)=>cmp(a,b)>=0?a:b);if(cmp(pattern(cards),best)!==0)return '必须选择可用的最高优先级牌型';if(best.length!==1)return '';const lead=round.plays.find(p=>p.id===winner(round)).cards[0].v;const counts={};hand.forEach(c=>counts[c.v]=(counts[c.v]||0)+1);const bigger=Object.keys(counts).map(Number).filter(v=>counts[v]>=n&&v>lead);if(!bigger.length)return '';let allowed=bigger;if(round.plays.length===2){allowed=bigger.filter(v=>v>=8);if(!allowed.length)allowed=[Math.max(...bigger)]}if(!allowed.includes(cards[0].v))return round.plays.length===2?'第三人必须按管牌要求出牌':'有能压过领先牌的牌时必须压牌';return ''}
function legal(hand,round){const ns=round.plays.length?[round.plays[0].cards.length]:[1,2,3,4];return ns.flatMap(n=>combinations(hand,n).filter(cs=>!validate(hand,cs,round)))}
function aiChoice(state,id){const hand=state.players[id].hand, choices=legal(hand,state.round);if(!state.round.plays.length){const seen=Array(11).fill(0);hand.forEach(c=>seen[c.v]++);state.history.forEach(r=>r.plays.forEach(p=>p.cards.forEach(c=>seen[c.v]++)));return choices.reduce((a,b)=>{const ka=[4-seen[a[0].v],-a.length,a[0].v],kb=[4-seen[b[0].v],-b.length,b[0].v];return cmp(ka,kb)<=0?a:b})}const lead=state.round.plays.find(p=>p.id===winner(state.round)).cards[0].v;const winning=choices.filter(c=>pattern(c).length===1&&c[0].v>lead);return (winning.length?winning:choices).reduce((a,b)=>(winning.length?b[0].v-a[0].v:b.reduce((s,c)=>s+c.v,0)-a.reduce((s,c)=>s+c.v,0))<0?b:a)}
function fresh(){return {phase:'ready',dealer:null,game:0,players:['东','北','西','你'].map(name=>({name,score:100,hand:[],won:[]})),round:null,history:[]}}
function startGame(s,random=Math.random){s.dealer=s.dealer===null?Math.floor(random()*4):(s.dealer+1)%4;const deck=SUITS.flatMap((suit,si)=>Array.from({length:10},(_,i)=>({v:i+1,s:si,id:si*10+i})));for(let i=deck.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}s.players.forEach((p,i)=>{p.hand=deck.filter((_,j)=>j%4===i);p.won=[]});s.game++;s.phase='playing';s.round={leader:s.dealer,plays:[]};s.history=[]}
function turn(s){return (s.round.leader+s.round.plays.length)%4}
function submit(s,id,cards){if(s.phase!=='playing'||id!==turn(s))return '尚未轮到该玩家';if(new Set(cards.map(c=>c.id)).size!==cards.length||cards.some(c=>!s.players[id].hand.some(h=>h.id===c.id)))return '所选牌不在手中';const error=validate(s.players[id].hand,cards,s.round);if(error)return error;const ids=new Set(cards.map(c=>c.id));s.players[id].hand=s.players[id].hand.filter(c=>!ids.has(c.id));s.round.plays.push({id,cards});if(s.round.plays.length===4){const w=winner(s.round),won=s.round.plays.find(p=>p.id===w).cards;s.players[w].won.push(...won);s.history.push(s.round);if(s.players.every(p=>!p.hand.length)){s.players.forEach(p=>p.score+=4*p.won.length-10);s.phase='finished';s.round=null}else s.round={leader:w,plays:[]}}return ''}
</script>
<script>
const $=id=>document.getElementById(id);let state=fresh(),selected=new Set(),review=false,timer=null,message='点击开始，进行一局游戏';
function save(){try{localStorage.setItem('guaguadeng-offline-v1',JSON.stringify(state))}catch(e){}}
try{const saved=JSON.parse(localStorage.getItem('guaguadeng-offline-v1'));if(saved&&['ready','playing','finished','ended'].includes(saved.phase)&&Array.isArray(saved.players)&&saved.players.length===4){state=saved;message=state.phase==='playing'?'已恢复上次对局':state.phase==='finished'?'本局已结算，可以开始下一局':state.phase==='ended'?'本场已结束':'点击开始，进行一局游戏'}}catch(e){}
function mini(c){return `<span class="mini ${c.s===1||c.s===2?'red':''}">${c.v===1?'A':c.v}<br>${SUITS[c.s]}</span>`}
function handCards(){return [...state.players[3].hand].sort((a,b)=>a.v-b.v||a.s-b.s)}
function isHuman(){return state.phase==='playing'&&!review&&turn(state)===3}
function render(){const shown=state.round?.plays.length?state.round:state.history.at(-1);const w=shown&&shown.plays.length===4?winner(shown):null;for(const [name,id] of [['east',0],['north',1],['west',2],['self',3]]){const p=state.players[id],active=state.phase==='playing'&&!review&&turn(state)===id;const play=shown?.plays.find(x=>x.id===id);$(name).classList.toggle('active',active);$(name).innerHTML=`<div class="seat-head"><span class="avatar">${p.name}</span><span class="seat-name">${p.name==='你'?'你':p.name+'家'} ${state.dealer===id?'<span class="badge">庄</span>':''}</span></div><div class="seat-stats">${p.score} 分 · 剩 ${p.hand.length} 张<br>获牌 ${p.won.length} 张${w===id?' · 本轮胜':''}</div>${id===3?'':`<div class="played">${play?play.cards.map(mini).join(''):''}</div>`}`}
const self=shown?.plays.find(x=>x.id===3);$('selfPlay').innerHTML=self?`<div class="played">${self.cards.map(mini).join('')}</div>`:'';$('roundLabel').textContent=state.game?`第 ${state.game} 局 · ${state.phase==='finished'?'已结算':'牌桌进行中'}`:'GUAGUADENG';$('message').textContent=message;$('startBtn').hidden=!['ready','finished','ended'].includes(state.phase)||review;$('startBtn').textContent=state.phase==='finished'?'开始下一局':state.phase==='ended'?'开始新的一场':'开始游戏';$('endBtn').disabled=state.phase==='ended';$('clearBtn').disabled=!isHuman()||!selected.size;$('hintBtn').disabled=!isHuman();$('playBtn').disabled=!isHuman();const cards=handCards();$('handCount').textContent=cards.length?`· ${cards.length} 张`:'';$('hand').innerHTML=cards.length?cards.map(c=>`<button class="card ${c.s===1||c.s===2?'red':''} ${selected.has(c.id)?'selected':''}" data-id="${c.id}" aria-pressed="${selected.has(c.id)}" aria-label="${SUITS[c.s]} ${c.v===1?'A':c.v}"><span class="v">${c.v===1?'A':c.v}</span><span class="s">${SUITS[c.s]}</span></button>`).join(''):'<div class="empty">发牌后，你的手牌会出现在这里</div>'}
function advance(){clearTimeout(timer);save();if(review){render();return}if(state.phase==='finished')message='本局已结算，可以开始下一局';else if(state.phase==='playing'){message=turn(state)===3?'轮到你出牌':'等待电脑出牌';if(turn(state)!==3)timer=setTimeout(()=>{if(state.phase!=='playing'||review||turn(state)===3)return;const id=turn(state);doPlay(id,aiChoice(state,id))},650)}render()}
function doPlay(id,cards){const before=state.history.length,err=submit(state,id,cards);if(err){message=err;render();return}selected.clear();if(state.history.length>before){review=true;const r=state.history.at(-1),w=winner(r),won=r.plays.find(p=>p.id===w).cards.length;message=`${state.players[w].name} 赢得本轮 · 获 ${won} 张`;save();render();timer=setTimeout(()=>{review=false;advance()},1800)}else advance()}
$('startBtn').onclick=()=>{if(state.phase==='ended')state=fresh();startGame(state);selected.clear();advance()};$('endBtn').onclick=()=>{if(!confirm('结束本场？未完成的本局将不计分。'))return;clearTimeout(timer);review=false;state.phase='ended';selected.clear();message='本场已结束，未完成局不计分';save();render()};$('hand').onclick=e=>{const el=e.target.closest('[data-id]');if(!el||!isHuman())return;const id=Number(el.dataset.id);selected.has(id)?selected.delete(id):selected.add(id);message=`已选择 ${selected.size} 张牌`;render()};$('clearBtn').onclick=()=>{selected.clear();render()};$('hintBtn').onclick=()=>{if(!isHuman())return;const choices=legal(handCards(),state.round);choices.sort((a,b)=>a.length-b.length||a.reduce((n,c)=>n+c.v,0)-b.reduce((n,c)=>n+c.v,0));selected=new Set(choices[0].map(c=>c.id));message='已选择一组合法出牌，可调整后出牌';render()};$('playBtn').onclick=()=>{if(isHuman())doPlay(3,handCards().filter(c=>selected.has(c.id)))};$('rulesBtn').onclick=()=>$('rulesDialog').showModal();$('closeRules').onclick=()=>$('rulesDialog').close();advance();
</script></body></html>
